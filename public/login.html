<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Agent 工作台</title>
  <script src="/js/preloadTheme.js"></script>
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <button class="login-theme-toggle icon-button" id="loginThemeToggle" type="button" aria-label="切换深色模式" title="切换深色模式">
      <svg class="login-theme-icon-light" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"></path>
      </svg>
      <svg class="login-theme-icon-dark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
    </button>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-mark" aria-hidden="true">A</div>
      <h1 id="loginTitle">Agent 工作台</h1>
      <p class="login-subtitle" id="loginSubtitle">登录你的个人工作区</p>

      <form id="loginForm" novalidate>
        <label for="loginUsername">用户名</label>
        <input id="loginUsername" name="username" type="text" autocomplete="username" maxlength="32" required autofocus>
        <label for="loginPassword">密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="128">
        <button class="login-primary" id="loginSubmit" type="submit">登录</button>
      </form>

      <form id="passwordChangeForm" novalidate hidden>
        <div class="login-notice">这是临时密码，请先设置新密码。</div>
        <input id="passwordChangeUsername" name="username" type="text" autocomplete="username" hidden>
        <label for="currentPassword">当前密码</label>
        <input id="currentPassword" type="password" autocomplete="current-password" maxlength="128">
        <label for="newPassword">新密码</label>
        <input id="newPassword" type="password" autocomplete="new-password" maxlength="128">
        <label for="confirmPassword">确认新密码</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128">
        <button class="login-primary" id="passwordChangeSubmit" type="submit">保存并进入工作区</button>
        <button class="login-secondary" id="loginSignOut" type="button">退出当前账户</button>
      </form>

      <p class="login-error" id="loginError" role="alert" aria-live="assertive"></p>
    </section>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
