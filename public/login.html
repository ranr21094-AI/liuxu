<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 工作日志</title>
  <script src="/js/preloadTheme.js"></script>
  <link rel="stylesheet" href="/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <button class="login-theme-toggle" id="loginThemeToggle" type="button" aria-label="切换深色模式" title="切换深色模式">◐</button>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-mark" aria-hidden="true">日</div>
      <h1 id="loginTitle">工作日志</h1>
      <p class="login-subtitle" id="loginSubtitle">登录你的个人工作区</p>

      <form id="loginForm" novalidate>
        <label for="loginUsername">用户名</label>
        <input id="loginUsername" name="username" type="text" autocomplete="username" maxlength="32" required autofocus>
        <label for="loginPassword">密码</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button class="login-primary" id="loginSubmit" type="submit">登录</button>
      </form>

      <form id="passwordChangeForm" novalidate hidden>
        <div class="login-notice">这是临时密码，请先设置新密码。</div>
        <input id="passwordChangeUsername" name="username" type="text" autocomplete="username" hidden>
        <label for="currentPassword">当前密码</label>
        <input id="currentPassword" type="password" autocomplete="current-password" maxlength="128" required>
        <label for="newPassword">新密码</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required aria-describedby="passwordHint">
        <p class="login-hint" id="passwordHint">至少 10 个字符</p>
        <label for="confirmPassword">确认新密码</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <button class="login-primary" id="passwordChangeSubmit" type="submit">保存并进入工作区</button>
        <button class="login-secondary" id="loginSignOut" type="button">退出当前账户</button>
      </form>

      <p class="login-error" id="loginError" role="alert" aria-live="assertive"></p>
    </section>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
