appId: com.worklog.desktop
productName: 留序 LiuXu
compression: maximum
directories:
  output: dist/desktop
  buildResources: electron
files:
  - package.json
  - server.js
  - database.js
  - business-date.js
  - secret-store.js
  - electron/**/*
  - lib/**/*
  - public/**/*
  - scripts/build-editor.mjs
  - "!data/**"
  - "!dist/**"
  - "!test/**"
  - "!node_modules/pdfjs-dist/node_modules/canvas/**"
  - "!.git/**"
  - "!.cursor/**"
  - "!.zcode/**"
  - "!**/*.md"
  - "!.env"
  - "!.env.example"
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: false
win:
  executableName: LiuXu
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.ico
  requestedExecutionLevel: asInvoker
mac:
  appId: ai.ranr21094.liuxu
  category: public.app-category.productivity
  icon: electron/icon.icns
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  artifactName: "LiuXu-${version}-mac-${arch}.${ext}"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: "留序 LiuXu ${version}"
  artifactName: "LiuXu-${version}-mac-${arch}.${ext}"
nsis:
  artifactName: "LiuXu-Setup-${version}-x64.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 留序 LiuXu
  runAfterFinish: true
  deleteAppDataOnUninstall: false
