appId: com.worklog.desktop
productName: 留序 LiuXu
compression: maximum
directories:
  output: dist/desktop
  buildResources: electron
files:
  - package.json
  - server.js
  - database.js
  - business-date.js
  - secret-store.js
  - electron/**/*
  - lib/**/*
  - public/**/*
  - scripts/build-editor.mjs
  - "!data/**"
  - "!dist/**"
  - "!test/**"
  - "!node_modules/pdfjs-dist/node_modules/canvas/**"
  - "!.git/**"
  - "!.cursor/**"
  - "!.zcode/**"
  - "!**/*.md"
  - "!.env"
  - "!.env.example"
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: false
win:
  executableName: LiuXu
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.ico
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: "LiuXu-Setup-${version}-x64.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 留序 LiuXu
  runAfterFinish: true
  deleteAppDataOnUninstall: false
